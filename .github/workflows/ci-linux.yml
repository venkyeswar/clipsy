# Shared crates (clipsy-core, clipsy-backends) and the Cargo files run both apps; app-specific code runs only that app.

name: CI Linux

# Runs for the Ubuntu app, the shared crates, app data and the GNOME extension; not for Windows-only or website changes.
on:
  push:
    paths:
      - 'crates/clipsy-app/**'
      - 'crates/clipsy-backends/**'
      - 'crates/clipsy-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'data/**'
      - 'gnome-extension/**'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    paths:
      - 'crates/clipsy-app/**'
      - 'crates/clipsy-backends/**'
      - 'crates/clipsy-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'data/**'
      - 'gnome-extension/**'
      - '.github/workflows/ci-linux.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          for attempt in 1 2 3 4; do
            if sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
               && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                  build-essential pkg-config libgtk-4-dev libadwaita-1-dev libx11-dev; then
              break
            fi
            if [ "$attempt" = 4 ]; then echo "::error::apt failed after 4 attempts"; exit 1; fi
            echo "apt failed (attempt $attempt), retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --exclude clipsy-windows

      - name: Test
        run: cargo test --workspace --exclude clipsy-windows

      - name: Clippy
        run: cargo clippy --workspace --exclude clipsy-windows --all-targets -- -D warnings
