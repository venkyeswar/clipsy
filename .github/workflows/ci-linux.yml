# Shared crates (clipsy-core, clipsy-backends) and the Cargo files run both apps; app-specific code runs only that app.

name: CI Linux

# Runs for the Ubuntu app, the shared crates, app data and the GNOME extension; not for Windows-only or website changes.
on:
  push:
    paths:
      - 'crates/clipsy-app/**'
      - 'crates/clipsy-backends/**'
      - 'crates/clipsy-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'data/**'
      - 'gnome-extension/**'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    paths:
      - 'crates/clipsy-app/**'
      - 'crates/clipsy-backends/**'
      - 'crates/clipsy-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'data/**'
      - 'gnome-extension/**'
      - '.github/workflows/ci-linux.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --exclude clipsy-windows

      - name: Test
        run: cargo test --workspace --exclude clipsy-windows

      - name: Clippy
        run: cargo clippy --workspace --exclude clipsy-windows --all-targets -- -D warnings
