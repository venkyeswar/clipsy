# Shared crates (clipsy-core, clipsy-backends) and the Cargo files run both apps; app-specific code runs only that app.

name: CI Windows

# Runs for the Windows app and the shared crates (clipsy-core, clipsy-backends), plus the Cargo files, packaging and this workflow.
on:
  push:
    paths:
      - 'crates/clipsy-windows/**'
      - 'crates/clipsy-core/**'
      - 'crates/clipsy-backends/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/windows/**'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'crates/clipsy-windows/**'
      - 'crates/clipsy-core/**'
      - 'crates/clipsy-backends/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/windows/**'
      - '.github/workflows/ci-windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build clipsy-windows
        run: cargo build -p clipsy-windows

      - name: Test clipsy-windows
        run: cargo test -p clipsy-windows

      - name: Clippy clipsy-windows
        run: cargo clippy -p clipsy-windows --all-targets -- -D warnings

      - name: Build the release clipsy.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release -p clipsy-windows
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit code $LASTEXITCODE" }

      - name: Copy clipsy.exe to dist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          # Same name users get in the release: clipsy.exe, not clipsy-windows.exe.
          Copy-Item 'target\release\clipsy-windows.exe' 'dist\clipsy.exe'
          if (-not (Test-Path 'dist\clipsy.exe')) { throw "dist\clipsy.exe was not created" }

      - name: Upload the test build
        uses: actions/upload-artifact@v4
        with:
          name: clipsy-windows-test
          path: dist/clipsy.exe
          if-no-files-found: error
          retention-days: 3
