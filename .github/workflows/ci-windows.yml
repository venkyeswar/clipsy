# Shared crates (clipsy-core, clipsy-backends) and the Cargo files run both apps; app-specific code runs only that app.

name: CI Windows

# Runs for the Windows app and the shared crates (clipsy-core, clipsy-backends), plus the Cargo files, packaging and this workflow.
on:
  push:
    paths:
      - 'crates/clipsy-windows/**'
      - 'crates/clipsy-core/**'
      - 'crates/clipsy-backends/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/windows/**'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'crates/clipsy-windows/**'
      - 'crates/clipsy-core/**'
      - 'crates/clipsy-backends/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packaging/windows/**'
      - '.github/workflows/ci-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build clipsy-windows
        run: cargo build -p clipsy-windows

      - name: Test clipsy-windows
        run: cargo test -p clipsy-windows

      - name: Clippy clipsy-windows
        run: cargo clippy -p clipsy-windows --all-targets -- -D warnings
