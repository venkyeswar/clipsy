name: Deploy website

# Builds the website (website/) and deploys it to the Cloudflare Worker `clipsy`
# with wrangler. The Worker serves static assets from website/dist and is attached
# to the custom domain in the Cloudflare dashboard.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  an API token with "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID the Cloudflare account ID
#
# Without them the job prints a notice and skips every step after the first,
# so the run stays green instead of failing.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not set; skipping the deploy."
          fi

      - name: Check out repository
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: npm ci

      - name: Lint
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: npm run lint

      - name: Test
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: npm test -- --run

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Deploy website
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy
