# Shared crates (clipsy-core, clipsy-backends) and the Cargo files run both apps; app-specific code runs only that app.

name: Snap

# Builds the snap on every push to main (and on version tags). The .snap file is
# attached to the run as a downloadable artifact. If the repository secret
# SNAPCRAFT_STORE_CREDENTIALS is set (from `snapcraft export-login`), the build is
# also uploaded to the Snap Store "edge" channel automatically.

on:
  push:
    branches: [main]
    paths:
      - 'snap/**'
      - 'crates/clipsy-app/**'
      - 'crates/clipsy-backends/**'
      - 'crates/clipsy-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'data/**'
      - 'gnome-extension/**'
      - '.github/workflows/snap.yml'
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      snap: ${{ steps.build.outputs.snap }}
    steps:
      - uses: actions/checkout@v4
      # Build directly on the runner. The runner is Ubuntu 24.04, the same as the
      # snap's base (core24), so no container is needed.
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Build snap
        id: build
        run: |
          set -o pipefail
          if ! sudo snapcraft pack --destructive-mode 2>&1 | tee build.log; then
            # Put the end of the log in a public error annotation for easy reading.
            msg=$(tail -n 40 build.log | python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'))")
            echo "::error title=snapcraft failed::${msg}"
            exit 1
          fi
          echo "snap=$(ls *.snap | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: clipsy-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          name: clipsy-snap
      - uses: snapcore/action-publish@v1
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ needs.build.outputs.snap }}
          release: edge
      - name: Skip publishing (no store credentials yet)
        if: env.SNAPCRAFT_STORE_CREDENTIALS == ''
        run: echo "SNAPCRAFT_STORE_CREDENTIALS is not set; the snap was built but not uploaded."
