[package]
name = "clipsy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clipboard history manager for Linux: text, images and files, one shortcut away"

[[bin]]
name = "clipsy"
path = "src/main.rs"

[dependencies]
libc = "0.2"
clipsy-core = { path = "../clipsy-core" }
clipsy-backends = { path = "../clipsy-backends" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
gdk-x11 = { package = "gdk4-x11", version = "0.9" }
x11rb = "0.13"
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[package.metadata.deb]
name = "clipsy"
maintainer = "venkyeswar <venkyeswar2037@gmail.com>"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "libc6, libgtk-4-1, libadwaita-1-0, libx11-6"
extended-description = """Clipsy remembers what you copy: text, rich text, images and files. \
Press a shortcut to open the history, search it, and paste any earlier item again. \
Everything stays on this machine."""
assets = [
    ["target/release/clipsy", "usr/bin/clipsy", "755"],
    ["../../data/io.github.clipsy.Clipsy.desktop", "usr/share/applications/", "644"],
    ["../../data/io.github.clipsy.Clipsy.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../data/icons/io.github.clipsy.Clipsy.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/clipsy/README.md", "644"],
]
