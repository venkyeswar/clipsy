[package]
name = "clipsy-backends"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clipsy-core = { path = "../clipsy-core" }
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes", "xtest", "xkb"] }
serde_json = "1"
base64 = "0.22"
