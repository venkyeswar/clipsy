[package]
name = "clipsy-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
