[package]
name = "clipsy-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clipboard history manager for Windows: text, images and files, one shortcut away"

[[bin]]
name = "clipsy-windows"
path = "src/main.rs"

[dependencies]
clipsy-core = { path = "../clipsy-core" }
clipsy-backends = { path = "../clipsy-backends" }
anyhow = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }
slint = "1"
tray-icon = "0.19"
winreg = "0.52"

[build-dependencies]
slint-build = "1"
