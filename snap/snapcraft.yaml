name: clipsy
title: Clipsy - Clipboard Manager
icon: snap/gui/clipsy.svg
base: core24
version: '0.3.0'
summary: 'Clipboard manager and history for Ubuntu: text, images and files, one key away'
description: |
  Clipsy keeps a history of what you copy: text, images, files and rich text.
  Press a shortcut (default Super+Shift+V), pick an item, and it pastes into the
  app you were using. Light and dark themes, search, pinned items, and
  configurable shortcuts. Everything stays on your computer.

  Works on Ubuntu's default desktop (GNOME, Wayland and Xorg). On Wayland it uses
  a small GNOME extension that Clipsy guides you to turn on.
license: GPL-3.0-or-later
grade: stable
confinement: strict

apps:
  clipsy:
    command: bin/clipsy
    common-id: io.github.clipsy.Clipsy
    extensions: [gnome]
    # Clipsy writes this file itself when "Start at login" is on.
    autostart: io.github.clipsy.Clipsy.desktop
    plugs:
      - desktop
      - desktop-legacy
      - x11

parts:
  # Installs the Rust toolchain with rustup. The Rust plugin on core24 expects
  # either a rustup on PATH or a part named "rust-deps" that provides it.
  rust-deps:
    plugin: nil
    build-packages:
      - curl
    override-pull: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain stable
      # Every later step (including the Rust plugin's pull) must find rustup and
      # cargo without sourcing ~/.cargo/env.
      ln -sf "$HOME"/.cargo/bin/* /usr/local/bin/

  clipsy:
    after: [rust-deps]
    plugin: rust
    source: .
    rust-path: [crates/clipsy-app]
    build-environment:
      - PATH: "${HOME}/.cargo/bin:${PATH}"
    build-packages:
      - pkg-config
    override-build: |
      craftctl default
      install -Dm644 data/io.github.clipsy.Clipsy.metainfo.xml \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/io.github.clipsy.Clipsy.metainfo.xml"

  # The GNOME Shell extension, zipped for the Clipsy app to install on Wayland.
  # Ends up at /snap/clipsy/current/share/clipsy/clipsy@venkyeswar.github.io.zip
  gnome-extension:
    plugin: nil
    source: gnome-extension/clipsy@venkyeswar.github.io
    build-packages:
      - zip
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/share/clipsy"
      cd "$CRAFT_PART_SRC"
      zip -r "$CRAFT_PART_INSTALL/share/clipsy/clipsy@venkyeswar.github.io.zip" metadata.json extension.js
