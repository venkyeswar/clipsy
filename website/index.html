<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Clipsy keeps your clipboard history on your computer, on Linux and Windows. Press a shortcut, search, and paste anything you copied earlier." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10132a" />
    <title>Clipsy — clipboard history for Linux and Windows</title>
    <script>
      // Pre-paint theme: mirrors ThemeProvider's resolution so there is no light flash.
      (function () {
        try {
          var stored = null;
          try {
            stored = window.localStorage.getItem("clipsy-theme");
          } catch (e) {}
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored !== "light" && systemDark);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
